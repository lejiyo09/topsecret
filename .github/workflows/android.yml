name: Android build & test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      signing: ${{ steps.signing.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: version
        run: echo "version=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: bash ci/prepare-signing.sh

      - name: Gradle build (unit tests, lint, debug, androidTest, release)
        id: gradle
        shell: bash
        run: |
          mkdir -p ci-out
          ./gradlew --no-daemon --stacktrace \
            testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease \
            2>&1 | tee ci-out/gradle-build.log

      - name: Inspect release APK (signature, manifest)
        run: bash ci/inspect-apk.sh

      - name: Surface build errors as annotations
        if: failure()
        shell: bash
        run: |
          grep -E '^e: |error:|FAILED|What went wrong|Exception' ci-out/gradle-build.log | head -40 |
            while IFS= read -r line; do echo "::error::${line}"; done || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/build/test-results/
            ci-out/

  device-test:
    name: Emulator tests (API ${{ matrix.api-level }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 30 = Android 11 (ARCVM on most current Chromebooks), 34 = Android 14
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build-output

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash ci/device-tests.sh ${{ matrix.api-level }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-api${{ matrix.api-level }}
          path: ci-out/

  publish:
    name: Publish GitHub Release
    needs: [build, device-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release if this version is new
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SIGNING_MODE: ${{ needs.build.outputs.signing }}
        run: bash ci/publish-release.sh

  report:
    name: Write CI report
    needs: [build, device-test, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts
      - name: Write report to the ci-reports branch
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEVICE_RESULT: ${{ needs.device-test.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PUBLISH_DETAIL: ${{ needs.publish.outputs.result }}
          VERSION: ${{ needs.build.outputs.version }}
          SIGNING_MODE: ${{ needs.build.outputs.signing }}
        run: bash ci/write-report.sh
